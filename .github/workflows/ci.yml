name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types & tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Requirements files match uv.lock
        if: matrix.python == '3.12'
        run: |
          uv export --frozen --no-dev --extra redis --no-hashes --no-emit-project -q -o requirements.txt
          uv export --frozen --extra dev --extra redis --no-hashes --no-emit-project -q -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt \
            || { echo "::error::requirements*.txt are stale. Regenerate them with the commands in the README."; exit 1; }

      - name: Ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Mypy
        run: uv run --frozen mypy

      - name: Pytest
        run: uv run --frozen pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: http-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name http-lab -p 8000:8000 --read-only --cap-drop ALL http-lab:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"ci":true}' http://127.0.0.1:8000/anything | grep -q '"ci":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/status/418)" = 418

      - name: Container logs
        if: always()
        run: docker logs http-lab || true
