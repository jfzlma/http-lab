# HTTP Lab — HTTP/API testing and inspection playground
# Project metadata and tooling configuration.

[project]
name = "http-lab"
version = "0.1.0"
description = "Self-hostable HTTP/API testing lab: inspect incoming requests and simulate server behaviour."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jafsal M A" }]
keywords = ["http", "testing", "api", "scrapy", "scraping", "httpbin", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in default args is idiomatic.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts in tests.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
warn_unused_ignores = true
